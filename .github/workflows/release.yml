name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write
    id-token: write

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: Build ${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      ext: ""
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      ext: ""
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      ext: ".exe"

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Ensure target is installed
              run: rustup target add ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      zeroclaw
                      mcp-servers

            # Build zeroclaw
            - name: Build zeroclaw
              working-directory: zeroclaw
              run: cargo build --release --locked --target ${{ matrix.target }}

            # Build MCP servers
            - name: Build MCP servers
              working-directory: mcp-servers
              run: cargo build --release --locked --target ${{ matrix.target }} -p browser-server -p config-server

            # Collect binaries into a staging directory
            - name: Stage binaries
              shell: bash
              run: |
                  mkdir -p staging
                  cp zeroclaw/target/${{ matrix.target }}/release/zeroclaw${{ matrix.ext }} staging/
                  cp mcp-servers/target/${{ matrix.target }}/release/browser-server${{ matrix.ext }} staging/
                  cp mcp-servers/target/${{ matrix.target }}/release/config-server${{ matrix.ext }} staging/

            # Package (Unix)
            - name: Package (Unix)
              if: runner.os != 'Windows'
              run: |
                  cd staging
                  tar czf ../local-agent-${{ matrix.target }}.tar.gz *

            # Package (Windows zip)
            - name: Package (Windows zip)
              if: runner.os == 'Windows'
              run: |
                  cd staging
                  7z a ../local-agent-${{ matrix.target }}.zip *

            # Build MSI (Windows only)
            - name: Install WiX toolset
              if: runner.os == 'Windows'
              run: |
                  dotnet tool install --global wix --version 4.0.6
              continue-on-error: true

            - name: Add WiX UI extension
              if: runner.os == 'Windows'
              run: wix extension add WixToolset.UI.wixext/4.0.6

            - name: Build MSI
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $version = "${{ github.ref_name }}".TrimStart("v")
                  # Ensure version is valid x.y.z format for MSI
                  if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.1.0" }
                  wix build wix/main.wxs `
                    -ext WixToolset.UI.wixext `
                    -d Version=$version `
                    -d BinDir=staging `
                    -o local-agent-${{ matrix.target }}.msi
              continue-on-error: true

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: local-agent-${{ matrix.target }}
                  path: |
                      local-agent-${{ matrix.target }}.*

    publish:
        name: Publish Release
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Generate SHA256 checksums
              run: |
                  cd artifacts
                  find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.msi' \) -exec sha256sum {} + | sed 's|  \./[^/]*/|  |' > SHA256SUMS
                  echo "Generated checksums:"
                  cat SHA256SUMS

            - name: Install cosign
              uses: sigstore/cosign-installer@v3

            - name: Sign artifacts with cosign (keyless)
              run: |
                  for file in artifacts/**/*; do
                    [ -f "$file" ] || continue
                    case "$file" in
                      *.tar.gz|*.zip|*.msi)
                        cosign sign-blob --yes \
                          --oidc-issuer=https://token.actions.githubusercontent.com \
                          --output-signature="${file}.sig" \
                          --output-certificate="${file}.pem" \
                          "$file"
                        ;;
                    esac
                  done

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      artifacts/**/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
